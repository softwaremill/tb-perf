# Cloud TigerBeetle hotspot-contention test configuration - rate sweep,
# pushed further still. Same as config.cloud-tigerbeetle-hotspot-rate40k.toml,
# but target_rate doubled again (40,000 -> 80,000) to keep probing for
# TigerBeetle's real ceiling under hotspot skew - rate40k achieved 40,388
# TPS with dropped_transfers=0, but showed the first real latency-growth
# signal in this sweep (p50 grew 70% vs 16% the step before; see
# hotspot-knob-sweep-results.md). max_concurrency raised to 200,000
# (40,000/client vs 16,000/client offered - same 2.5x headroom ratio as
# rate40k) so any real slowdown shows up as latency growth, not an
# artificial drop from an undersized cap.

[workload]
test_mode = "fixed_rate"
target_rate = 80000  # Total requests/sec across all 5 client instances
max_concurrency = 200000
num_accounts = 100000
zipfian_exponent = 2.0
initial_balance = 1000000
min_transfer_amount = 1
max_transfer_amount = 1000
warmup_duration_secs = 120
test_duration_secs = 300

[database]
type = "tigerbeetle"

[tigerbeetle]
cluster_addresses = ["tb-node-1:3000", "tb-node-2:3000", "tb-node-3:3000"]

[deployment]
type = "cloud"
num_db_nodes = 3
num_client_nodes = 5
gcp_project = "tigerbettle-sandbox"
gcp_region = "europe-central2"
db_machine_type = "n2-highmem-4"
client_machine_type = "n2-standard-2"
measure_network_latency = true

[coordinator]
test_runs = 3
max_variance_threshold = 0.10
max_error_rate = 0.05
metrics_export_path = "./results"
keep_grafana_running = true

[monitoring]
grafana_port = 3000
prometheus_port = 9090
otel_collector_port = 4317
