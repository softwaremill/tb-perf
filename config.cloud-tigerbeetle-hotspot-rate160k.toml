# Cloud TigerBeetle hotspot-contention test configuration - rate sweep,
# pushed further still, with wider latency histogram buckets. Same as
# config.cloud-tigerbeetle-hotspot-rate80k.toml, but target_rate doubled
# again (80,000 -> 160,000) to keep probing for TigerBeetle's real ceiling
# under hotspot skew - rate80k achieved 81,171 TPS with dropped_transfers=0
# but showed a dramatic median-latency jump (p50 73ms -> 664ms, +810%),
# the strongest saturation signal in the whole sweep (see
# hotspot-knob-sweep-results.md). max_concurrency raised to 400,000
# (80,000/client vs 32,000/client offered - same 2.5x headroom ratio used
# throughout this sweep) so any further slowdown shows up as latency
# growth, not an artificial drop from an undersized cap. Requires the
# widened client/src/metrics.rs histogram buckets (up to 20s) to get a
# trustworthy tail-latency reading this time, since rate40k/rate80k's
# p99/p999 were capped by the old 1.5s boundary.

[workload]
test_mode = "fixed_rate"
target_rate = 160000  # Total requests/sec across all 5 client instances
max_concurrency = 400000
num_accounts = 100000
zipfian_exponent = 2.0
initial_balance = 1000000
min_transfer_amount = 1
max_transfer_amount = 1000
warmup_duration_secs = 120
test_duration_secs = 300

[database]
type = "tigerbeetle"

[tigerbeetle]
cluster_addresses = ["tb-node-1:3000", "tb-node-2:3000", "tb-node-3:3000"]

[deployment]
type = "cloud"
num_db_nodes = 3
num_client_nodes = 5
gcp_project = "tigerbettle-sandbox"
gcp_region = "europe-central2"
db_machine_type = "n2-highmem-4"
client_machine_type = "n2-standard-2"
measure_network_latency = true

[coordinator]
test_runs = 3
max_variance_threshold = 0.10
max_error_rate = 0.05
metrics_export_path = "./results"
keep_grafana_running = true

[monitoring]
grafana_port = 3000
prometheus_port = 9090
otel_collector_port = 4317
