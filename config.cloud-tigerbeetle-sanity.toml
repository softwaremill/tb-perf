# Cloud TigerBeetle sanity-check configuration
# Quick test (short warmup/measurement) for validating cloud orchestration
# changes without waiting through a full-length run.

[workload]
test_mode = "max_throughput"
concurrency = 4
num_accounts = 1000
zipfian_exponent = 1.0
initial_balance = 1000000
min_transfer_amount = 1
max_transfer_amount = 1000
warmup_duration_secs = 5
test_duration_secs = 10

[database]
type = "tigerbeetle"

[tigerbeetle]
cluster_addresses = ["3000"] # overridden by --tb-addresses at runtime (see coordinator/src/gcp_workload.rs)

[deployment]
type = "cloud"
num_db_nodes = 3
num_client_nodes = 2
gcp_project = "tigerbettle-sandbox"
gcp_region = "europe-central2"
db_machine_type = "n2-highmem-4"
client_machine_type = "n2-standard-2"
measure_network_latency = false

[coordinator]
test_runs = 1
max_variance_threshold = 0.10
max_error_rate = 0.05
metrics_export_path = "./results"
keep_grafana_running = true

[monitoring]
grafana_port = 3000
prometheus_port = 9090
otel_collector_port = 4317
