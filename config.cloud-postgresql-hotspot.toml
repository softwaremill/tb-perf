# Cloud PostgreSQL hotspot-contention test configuration
# Mirrors config.cloud-tigerbeetle-hotspot.toml for a fair comparison - same
# workload shape, same 3-node cluster/quorum topology, but with a much
# sharper Zipfian skew (2.0 vs the standard test's 1.0) so a small number of
# "hub" accounts absorb a disproportionate share of transfers - surfaces
# FOR UPDATE row-lock contention/deadlock-retry overhead under hot accounts.

[workload]
test_mode = "fixed_rate"
target_rate = 5000 # Total requests/sec across all client instances
max_concurrency = 1000
num_accounts = 100000
zipfian_exponent = 2.0
initial_balance = 1000000
min_transfer_amount = 1
max_transfer_amount = 1000
warmup_duration_secs = 120
test_duration_secs = 300

[database]
type = "postgresql"

[postgresql]
isolation_level = "read_committed"
connection_pool_size = 20
connection_pool_min_idle = 20
executor_mode = "standard"

[deployment]
type = "cloud"
num_db_nodes = 3
num_client_nodes = 5
gcp_project = "tigerbettle-sandbox"
gcp_region = "europe-central2"
db_machine_type = "n2-highmem-4"
client_machine_type = "n2-standard-2"
measure_network_latency = true

[coordinator]
test_runs = 3
max_variance_threshold = 0.10
max_error_rate = 0.05
metrics_export_path = "./results"
keep_grafana_running = true

[monitoring]
grafana_port = 3000
prometheus_port = 9090
otel_collector_port = 4317
