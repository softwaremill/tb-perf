# Cloud PostgreSQL batched-executor max_throughput test configuration
# Uses the batched executor mode (single connection, batched transfers via
# the batch_transfers SQL function - see scripts/test-batch-transfers.sql).
# Unlike the standard/atomic executors, this uses max_throughput mode (not
# fixed_rate) - batched mode's design is one connection saturated with large
# batches, so pacing individual request submission at a fixed rate defeats
# the point and just exposes the single-connection bottleneck (confirmed:
# fixed_rate against this executor never drains its in-flight backlog within
# the harness's SSH command timeout). Mirrors config.local-postgresql-batched.toml's
# own choice of max_throughput for the same reason.

[workload]
test_mode = "max_throughput"
concurrency = 10
num_accounts = 100000
zipfian_exponent = 1.0
initial_balance = 1000000
min_transfer_amount = 1
max_transfer_amount = 1000
warmup_duration_secs = 120
test_duration_secs = 300

[database]
type = "postgresql"

[postgresql]
isolation_level = "read_committed"
connection_pool_size = 1  # Ignored in batched mode (single connection used)
connection_pool_min_idle = 1
executor_mode = "batched"

[deployment]
type = "cloud"
num_db_nodes = 3
num_client_nodes = 5
gcp_project = "tigerbettle-sandbox"
gcp_region = "europe-central2"
db_machine_type = "n2-highmem-4"
client_machine_type = "n2-standard-2"
measure_network_latency = true

[coordinator]
test_runs = 3
max_variance_threshold = 0.10
max_error_rate = 0.05
metrics_export_path = "./results"
keep_grafana_running = true

[monitoring]
grafana_port = 3000
prometheus_port = 9090
otel_collector_port = 4317
